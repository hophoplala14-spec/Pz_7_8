{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- подстраивает экран для пк или тел -->
    <title>{% block title %}GOIDA {% endblock %}</title>
     <!-- это название конкретного сайта иначе все будет называться одинаково -->
     <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Шапка сайта -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'core:home' %}">Фитнес-клуб «Сила»</a>
        <div class="d-flex gap-3">
            <a class="text-light text-decoration-none" href="{% url 'club:trainer_list' %}">Тренеры</a>
            <!-- text-light - Делает цвет текста светло-серым -->
            <!-- text-decoration-none -  Убирает подчёркивание у ссылок -->
            <a class="text-light text-decoration-none" href="{% url 'club:class_list' %}">Занятия</a>
            <a class="text-light text-decoration-none" href="{% url 'club:client_create' %}">Записаться</a>
        </div>
    </div>
</nav>

<main class="container my-4">
    {% block content %}
    <!--  Класс container он ограничит ширину -->
    <!--  Класс my-4.  m — margin (внешний отступ). y — по вертикали (ось Y, то есть сверху и снизу). 4 — размер отступа (в Bootstrap это примерно 24 пикселя).-->
    {% endblock %}
</main>
<footer class="bg-dark text-light py-3 mt-5 text-center">
    <p class="mb-0">2026 Фитнес-клуб «Сила»</p>
</footer>
</body>
</html>
